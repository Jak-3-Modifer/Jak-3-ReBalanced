name: Cut Mod Release ⭐

on:
  push:
    tags:
      - 'v*-alpha.*'
      - 'v*-beta.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Explicit Release Tag (leave blank for an automatic semver bump)'
        required: false
        default: 'v0.1.0-alpha.1'
        type: string
      prerelease:
        description: 'Mark as a GitHub pre-release?'
        required: true
        default: true
        type: boolean
      bump:
        description: 'Semver Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      binary_source:
        description: 'Binary Source'
        required: true
        default: 'build_binaries'
        type: choice
        options:
          - vanilla
          - modbase
          - build_binaries
      jak1:
        description: 'Supports Jak 1?'
        required: true
        default: 'false'
        type: boolean
      jak2:
        description: 'Supports Jak 2?'
        required: true
        default: 'false'
        type: boolean
      jak3:
        description: 'Supports Jak 3?'
        required: true
        default: 'true'
        type: boolean
      jakx:
        description: 'Supports Jak X?'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  prep_vars:
    name: "Prep Variables"
    runs-on: ubuntu-latest
    outputs:
      supported_games: ${{ steps.prep-vars.outputs.GAMES }}
      tooling_repo: ${{ steps.prep-vars.outputs.REPO }}
    steps:
      - name: Prep Variables
        id: prep-vars
        run: |
          GAMES=
          if [[ "${{ github.event_name }}" == "push" ]]; then
            GAMES=jak3
          else
            if [[ "${{ inputs.jak1 }}" == "true" ]]; then GAMES+=jak1,; fi
            if [[ "${{ inputs.jak2 }}" == "true" ]]; then GAMES+=jak2,; fi
            if [[ "${{ inputs.jak3 }}" == "true" ]]; then GAMES+=jak3,; fi
            if [[ "${{ inputs.jakx }}" == "true" ]]; then GAMES+=jakx,; fi
            GAMES=${GAMES%?}
          fi
          echo "GAMES=$GAMES" >> $GITHUB_OUTPUT
          REPO=OpenGOAL-Mods/OG-Mod-Base
          if [[ "${{ inputs.binary_source }}" == "vanilla" ]]; then REPO=open-goal/jak-project; fi
          echo "REPO=$REPO" >> $GITHUB_OUTPUT

  cut_mod_release:
    name: "Cut Mod Release"
    needs: prep_vars
    uses: ./.github/workflows/mod-release-pipeline.yml
    with:
      semverBump: ${{ inputs.bump }}
      releaseTag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      prerelease: ${{ github.event_name == 'push' || inputs.prerelease }}
      metadataSupportedGames: ${{ needs.prep_vars.outputs.supported_games }}
      buildBinaries: ${{ github.event_name == 'push' || inputs.binary_source == 'build_binaries'}}
      toolingRepo: ${{ needs.prep_vars.outputs.tooling_repo }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
